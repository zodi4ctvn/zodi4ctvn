<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Built to run 24/7">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <rect x="100" y="22" width="800" height="2" fill="url(#bar)"/>
    <text x="500" y="56" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="8" fill="#8fb8e8">DESIGNED TO RUN  ·  BUILT TO LAST</text>
    <text x="500" y="76" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#58A6FF" opacity="0.7">ZODI4C</text>
  </g>
</svg>
