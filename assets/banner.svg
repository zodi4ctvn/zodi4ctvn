<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Zodi4c - Discord Bots, FiveM, Automation">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#050d18"/>
      <stop offset="0.5" stop-color="#0b2d52"/>
      <stop offset="1" stop-color="#050d18"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 -0.25;0.5 0.25;-0.5 -0.25" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ccbff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- Moving light -->
    <circle cy="140" r="220" fill="url(#glow)">
      <animate attributeName="cx" values="150;850;150" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Scanline sweep -->
    <rect width="1000" height="2" fill="#58A6FF" opacity="0.12">
      <animate attributeName="y" values="-4;284" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#58A6FF" stroke-opacity="0.25"/>

  <!-- Content (fades in) -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0s" fill="freeze"/>

    <!-- Corner brackets -->
    <g fill="none" stroke="#58A6FF" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round">
      <path d="M40 60V40H100"/>
      <path d="M960 60V40H900"/>
      <path d="M40 220V240H100"/>
      <path d="M960 220V240H900"/>
    </g>

    <!-- Top label -->
    <text x="500" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="7" fill="#8fb8e8">DISCORD BOTS  /  FIVEM  /  AUTOMATION</text>

    <!-- Neon glow copy -->
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="#58A6FF" filter="url(#neon)" opacity="0.75">Zodi4c
      <animate attributeName="opacity" values="0.75;0.45;0.8;0.5;0.75" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Glitch layers -->
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="#39d0ff" opacity="0">Zodi4c
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 0;4 1;-3 -1;0 0;0 0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0.6;0.8;0;0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="#1f6feb" opacity="0">Zodi4c
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 0;-4 -1;3 1;0 0;0 0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0.6;0.8;0;0" keyTimes="0;0.88;0.90;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>

    <!-- Main name -->
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="url(#nameFill)">Zodi4c</text>

    <!-- Slogan -->
    <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" letter-spacing="5" fill="#cfe3ff">BUILDING BOTS. SHIPPING SYSTEMS.</text>

    <!-- Bottom accent line -->
    <line x1="380" y1="236" x2="620" y2="236" stroke="#58A6FF" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="1.6s" begin="0.4s" fill="freeze"/>
    </line>
  </g>
</svg>
